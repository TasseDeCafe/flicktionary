<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B1D5A"/>
      <stop offset="0.45" stop-color="#C2407A"/>
      <stop offset="0.72" stop-color="#FF7A4E"/>
      <stop offset="1" stop-color="#FFAE5C"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFE1A0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFE1A0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g fill="#FFE8B0" opacity="0.35">
      <polygon points="244,320 268,320 256,110" transform="rotate(-60 256 320)"/>
      <polygon points="244,320 268,320 256,110" transform="rotate(-20 256 320)"/>
      <polygon points="244,320 268,320 256,110" transform="rotate(20 256 320)"/>
      <polygon points="244,320 268,320 256,110" transform="rotate(60 256 320)"/>
    </g>
    <circle cx="256" cy="320" r="190" fill="url(#glow)"/>
    <circle cx="256" cy="320" r="78" fill="#FFD76A"/>
    <ellipse cx="256" cy="480" rx="390" ry="140" fill="#7E2D5F"/>
    <rect x="96" y="360" width="180" height="26" rx="13" fill="#A84E7F"/>
    <rect x="140" y="404" width="150" height="32" rx="16" fill="#FFC233"/>
    <ellipse cx="256" cy="620" rx="440" ry="180" fill="#3A1238"/>
  </g>
</svg>
