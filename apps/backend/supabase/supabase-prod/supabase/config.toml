# Source of truth for the HOSTED prod project's configuration
# (uynwhkflqmryzkenccmd). Applied with `supabase config push` — via
# `pnpm --filter @flicktionary/backend db:prod:config:push` or the
# prod-config-push workflow on merge to main. This local stack is never
# started; the ports and other local-only keys below are inert.
#
# Sharp edges of `config push` (learned the hard way — see the
# supabase-config-push-auto-confirm incident, 2026-07-31):
#   - It AUTO-CONFIRMS in non-interactive/agent environments. Treat any push
#     as a deploy, never as a dry-run. `supabase link` diffs read-only.
#   - Absent keys are pushed as CLI DEFAULTS, not "leave unchanged" — every
#     remote-relevant value must be stated explicitly in this file.
#   - `env(VAR)` with an unset variable pushes the literal string. This file
#     must therefore contain NO env() references; the push script enforces it.
#   - Secret fields set to "" are skipped, leaving the stored secret
#     untouched. Secrets are set once in the dashboard and never live here.
project_id = "supabase-prod"

[api]
enabled = true
# Port to use for the API URL.
port = 44321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. public and storage are always included.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request. public is always included.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 44322
# Port used by db diff command to initialize the shadow database.
shadow_port = 44320
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 44329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[realtime]
enabled = false
# Bind realtime via either IPv4 or IPv6. (default: IPv6)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 44323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = false
# Port to use for the email testing server web interface.
port = 44324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 44325
# pop3_port = 44326

[storage]
enabled = false
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails ({{ .SiteURL }} in templates, and the fallback redirect when a
# sign-in request carries no redirectTo).
site_url = "https://app.flicktionary.app"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://app.flicktionary.app/**"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Manual identity linking powers guest -> account conversion: the web app calls
# supabase.auth.linkIdentity() on an anonymous session to attach a Google login.
enable_manual_linking = true
# Anonymous (guest) sign-ins stay permanently on at the Supabase layer; the
# actual door is the backend's GUEST_MODE_ENABLED kill switch.
enable_anonymous_sign_ins = true

signing_keys_path = "./signing_key.json"

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# Maps to GoTrue MAILER_AUTOCONFIRM (inverted). Must stay enabled: with
# autoconfirm on, updateUser({ email }) — the guest -> account conversion —
# applies the address instantly without proving the guest owns it. Magic-link
# sign-in is unaffected (its OTP email is itself the verification).
enable_confirmations = true
# Explicit because `config push` treats absent keys as "use the CLI default"
# (6-digit codes, 1s resend throttle) and would overwrite the remote values.
otp_length = 8
max_frequency = "1m0s"

[auth.mfa]
max_enrolled_factors = 10

# Explicit for the same reason: the CLI default (false) would disable TOTP
# enrollment on the hosted project.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.magic_link]
subject = "flicktionary.app Sign In Link"
content_path = "./supabase/templates/magic-link-verification.html"

# Sent when a user changes (or, for anonymous guests, first sets) their email
# via supabase.auth.updateUser({ email }) — the guest -> account conversion flow.
[auth.email.template.email_change]
subject = "flicktionary.app Email Confirmation"
content_path = "./supabase/templates/email-change-verification.html"

# Invisible Turnstile on the anonymous /signup flow only — every other auth
# flow rides captcha-exempt endpoints (see issue
# https://github.com/TasseDeCafe/flicktionary/issues/391). This is the
# emergency abuse lever, off by default. To flip it on: the Turnstile secret
# must already be stored on the hosted project (set it once in the dashboard's
# captcha settings during Cloudflare setup — the empty string below means
# "leave the stored secret untouched", so pushes never clear it), then set
# enabled = true here, push, and flip CAPTCHA_ENABLED in Doppler so the web
# app starts requesting challenges.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = ""

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users-router need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users-router
template = "Your code is {{ .Code }}"

# Use pre-defined map of phone number to OTP for testing.
[auth.sms.test_otp]
# 4152127777 = "123456"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
[auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"


# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = ""


# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
# Apple sign-in is not configured on the hosted project (native iOS is out of
# scope for now); keep disabled so `config push` doesn't turn it on.
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""

[auth.external.google]
enabled = true
# The OAuth client id is public (it appears in every consent redirect).
client_id = "174431187657-b7pi6udnt9uu1r8b10tchj8bd8ffml7t.apps.googleusercontent.com"
# Empty means "leave the secret stored on the hosted project untouched" —
# `config push` skips secret fields with no local value. Never put an env()
# here that could resolve empty: that would wipe the stored secret.
secret = ""
# Overrides the default auth redirectUrl.
redirect_uri = "http://localhost:54321/auth/v1/callback"
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# We need this to skip nonce check because Google Sign In doesn't work without it on iOS devices
skip_nonce_check = true


[analytics]
enabled = false
port = 44327
vector_port = 44328
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"
