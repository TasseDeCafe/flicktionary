<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FACC15" />

    <!-- Apply the cached resolved theme before first paint to avoid a flash.
         Kept in sync by apps/web/src/stores/theme-store.ts (key: flick.theme.resolved). -->
    <script>
      try {
        var resolved = localStorage.getItem('flick.theme.resolved')
        if (resolved !== 'dark' && resolved !== 'light') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (resolved === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#030711')
        }
      } catch (e) {}
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flicktionary — learn languages from movies and texts</title>

    <meta
      name="description"
      content="A language-learning companion for movie subtitles and pasted text. Highlight what you don't understand, explore each chunk in context, and practice through short LLM-generated readings."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.flicktionary.app/" />
    <meta property="og:title" content="Flicktionary — learn languages from movies and texts" />
    <meta
      property="og:description"
      content="A language-learning companion for movie subtitles and pasted text. Highlight what you don't understand, explore each chunk in context, and practice through short LLM-generated readings."
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flicktionary — learn languages from movies and texts" />
    <meta
      name="twitter:description"
      content="A language-learning companion for movie subtitles and pasted text. Highlight what you don't understand, explore each chunk in context, and practice through short LLM-generated readings."
    />
    <meta name="twitter:image" content="https://app.flicktionary.app/opengraph-image.png" />
    <meta name="apple-itunes-app" content="app-id=6741498422" />
