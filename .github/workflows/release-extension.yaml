name: Release extension

# Cut a release by tagging a commit with the extension version, e.g.:
#   git tag v0.0.2 && git push origin v0.0.2
# The tag (minus the leading "v") must match packages/extension/package.json's
# "version" — that same value becomes the manifest version and the version shown
# in the in-app "asbplayer updated to version X" toast, whose "release notes"
# link points at this release's page.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest

    # Production endpoints baked into the bundle. These are publishable (anon)
    # values; if a secret is unset the config falls back to its placeholder.
    env:
      WXT_PUBLIC_SUPABASE_PROJECT_URL: ${{ secrets.WXT_PUBLIC_SUPABASE_PROJECT_URL }}
      WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/extension/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match packages/extension/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing extension version $PKG_VERSION"

      - name: Typecheck
        run: pnpm --filter @flicktionary/extension check:types

      - name: Build Chrome zip
        run: pnpm --filter @flicktionary/extension exec wxt zip

      - name: Build Firefox zip
        run: pnpm --filter @flicktionary/extension exec wxt zip -b firefox

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            packages/extension/.output/*.zip
