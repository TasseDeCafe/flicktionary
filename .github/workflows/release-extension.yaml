name: Release extension

# Cut a release by tagging a commit with the extension version, e.g.:
#   git tag v0.0.2 && git push origin v0.0.2
# The tag (minus the leading "v") must match apps/extension/package.json's
# "version" — that same value becomes the manifest version and the version shown
# in the in-app "asbplayer updated to version X" toast, whose "release notes"
# link points at this release's page.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      # The WXT_PUBLIC_* endpoints baked into the bundle live in Doppler
      # (project `extension`, config `prd`) — the same source local prod builds
      # use, so there is exactly one copy to rotate. flicktionary-config.ts has
      # NO fallbacks: a build without these vars throws at runtime, so the zips
      # must be produced under `doppler run`. EXTENSION_PRD_DOPPLER_TOKEN is a
      # read-only service token scoped to extension/prd, synced to GitHub via
      # the root/prd Doppler project.
      - uses: dopplerhq/cli-action@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lingui compiles the catalogs into gitignored `messages.ts` files that
      # the extension imports (`@flicktionary/i18n/locales/*/messages.ts`). A
      # fresh CI checkout doesn't have them, so the typecheck and the zip build
      # both fail with "Cannot find module .../messages.ts" without this step.
      - name: Compile i18n catalogs
        run: pnpm --filter @flicktionary/i18n lingui:compile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match apps/extension/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing extension version $PKG_VERSION"

      - name: Typecheck
        run: pnpm --filter @flicktionary/extension check:types

      - name: Build Chrome zip
        env:
          DOPPLER_TOKEN: ${{ secrets.EXTENSION_PRD_DOPPLER_TOKEN }}
        run: doppler run -- pnpm --filter @flicktionary/extension exec wxt zip

      - name: Build Firefox zip
        env:
          DOPPLER_TOKEN: ${{ secrets.EXTENSION_PRD_DOPPLER_TOKEN }}
        run: doppler run -- pnpm --filter @flicktionary/extension exec wxt zip -b firefox

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            apps/extension/.output/*.zip

      # Uploads the zip as a new draft and submits it for review; publishing
      # happens automatically once the (asynchronous) review passes. Requires a
      # one-time manual first upload in the CWS dashboard (the API cannot create
      # new items) plus OAuth credentials — see publish-browser-extension's
      # `init` walkthrough. Skips with a notice until the secrets exist so
      # tagging still cuts a GitHub release without them.
      #
      # publish-browser-extension is pinned: 4.0.5 is the first line that runs
      # on Node 24 (wxt's bundled 3.0.3 crashes at startup), and an unpinned
      # `npx` would execute whatever the registry serves next.
      - name: Submit to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -z "$CHROME_EXTENSION_ID" ]; then
            echo "::notice::Chrome Web Store secrets not configured; skipping store submission"
            exit 0
          fi
          npx -y publish-browser-extension@4.0.5 \
            --chrome-zip apps/extension/.output/*-chrome.zip \
            --chrome-extension-id "$CHROME_EXTENSION_ID" \
            --chrome-client-id "$CHROME_CLIENT_ID" \
            --chrome-client-secret "$CHROME_CLIENT_SECRET" \
            --chrome-refresh-token "$CHROME_REFRESH_TOKEN"

      # Submits the new version to addons.mozilla.org for review (channel
      # `listed` → AMO publishes automatically once review passes). We use
      # Mozilla's own `web-ext sign` here instead of publish-browser-extension
      # because only web-ext can attach the reviewer notes: --amo-metadata feeds
      # apps/extension/amo-metadata.json, whose `version.approval_notes` is the
      # AMO "Notes to Reviewer" field (build instructions for our bundled WXT
      # output — keep it in sync with the human copy in AMO-LISTING.md).
      # --upload-source-code attaches the workspace source archive `wxt zip`
      # already produced, so AMO can rebuild the minified bundle. web-ext reads
      # the add-on id from the manifest's browser_specific_settings.gecko.id.
      # Pinned: 10.4.0 is current and runs on Node 24; an unpinned npx would run
      # whatever the registry serves next. Skips with a notice until the AMO API
      # credentials exist, so tagging still cuts a GitHub release without them.
      - name: Submit to Firefox Add-ons (AMO)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "::notice::AMO API credentials not configured; skipping Firefox submission"
            exit 0
          fi
          npx -y web-ext@10.4.0 sign \
            --channel listed \
            --source-dir apps/extension/.output/firefox-mv2 \
            --upload-source-code apps/extension/.output/*-sources.zip \
            --amo-metadata apps/extension/amo-metadata.json \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
