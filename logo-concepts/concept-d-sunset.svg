<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept D in the Sunset palette: ink ticket on rose→orange,
       orange entry accents. Pairs with the white-F sunset favicon. -->
  <defs>
    <linearGradient id="dsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <mask id="dsticket">
      <rect width="512" height="512" fill="black"/>
      <rect x="88" y="176" width="336" height="160" rx="26" fill="white"/>
      <circle cx="88" cy="256" r="20" fill="black"/>
      <circle cx="424" cy="256" r="20" fill="black"/>
      <line x1="336" y1="192" x2="336" y2="320" stroke="black" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="0.1 18"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#dsbg)"/>

  <g transform="rotate(-6 256 256)">
    <rect x="88" y="176" width="336" height="160" rx="26" fill="#1C1917" mask="url(#dsticket)"/>
    <rect x="120" y="216" width="118" height="30" rx="15" fill="#FB923C"/>
    <rect x="120" y="268" width="158" height="22" rx="11" fill="#F5F1E8"/>
    <path d="M362 236 L362 276 L394 256 Z" fill="#FB923C"/>
  </g>
</svg>
