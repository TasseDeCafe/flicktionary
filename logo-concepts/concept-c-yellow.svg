<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- F-strip, colorway: yellow-500 mark on dark slate (the app's reader palette). -->
  <defs>
    <radialGradient id="cybg" cx="0.5" cy="0.25" r="1.15">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </radialGradient>
    <linearGradient id="cyf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FACC15"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <mask id="cymark">
      <rect width="512" height="512" fill="black"/>
      <rect x="150" y="124" width="76" height="264" rx="32" fill="white"/>
      <rect x="150" y="124" width="212" height="68" rx="32" fill="white"/>
      <rect x="150" y="238" width="158" height="60" rx="30" fill="white"/>
      <rect x="175" y="202" width="26" height="26" rx="8" fill="black"/>
      <rect x="175" y="310" width="26" height="26" rx="8" fill="black"/>
      <rect x="175" y="350" width="26" height="26" rx="8" fill="black"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#cybg)"/>
  <rect width="512" height="512" fill="url(#cyf)" mask="url(#cymark)"/>
</svg>
