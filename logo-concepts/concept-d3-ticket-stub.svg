<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept D3 — "Ticket stub": portrait ticket, which fills a square canvas
       far better than landscape. Entry on top, perforation + play stub below. -->
  <defs>
    <linearGradient id="d3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <mask id="d3ticket">
      <rect x="146" y="80" width="220" height="352" rx="30" fill="white"/>
      <circle cx="146" cy="332" r="22" fill="black"/>
      <circle cx="366" cy="332" r="22" fill="black"/>
      <line x1="186" y1="332" x2="326" y2="332" stroke="black" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="0.1 22"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#d3bg)"/>

  <g transform="rotate(-6 256 256)">
    <rect x="146" y="80" width="220" height="352" rx="30" fill="#1C1917" mask="url(#d3ticket)"/>
    <!-- entry -->
    <rect x="182" y="128" width="110" height="30" rx="15" fill="#FACC15"/>
    <rect x="182" y="182" width="148" height="22" rx="11" fill="#E7E5E4"/>
    <rect x="182" y="226" width="118" height="22" rx="11" fill="#E7E5E4" opacity="0.6"/>
    <!-- stub: play glyph -->
    <path d="M236 356 L236 408 L278 382 Z" fill="#FACC15"/>
  </g>
</svg>
