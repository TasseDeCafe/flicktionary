  <ellipse cx="256" cy="330" rx="80" ry="56" fill="#FBBF24" opacity="0.3" filter="url(#hpglow)"/>

  <rect x="168" y="176" width="176" height="232" rx="38" fill="#FFFFFF" opacity="0.5"/>
  <rect x="168" y="176" width="176" height="232" rx="38" fill="none" stroke="#1C1917" stroke-width="12"/>
  <rect x="150" y="148" width="212" height="26" rx="13" fill="#1C1917"/>

