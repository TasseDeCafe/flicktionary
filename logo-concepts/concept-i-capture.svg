<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept I — "Capture": a cursor grabbing a highlighted word — gather
       vocab from anywhere on the web with one click. -->
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#ibg)"/>

  <!-- highlighted word -->
  <rect x="92" y="170" width="248" height="108" rx="44" fill="#FFFFFF"/>
  <rect x="126" y="204" width="180" height="40" rx="20" fill="#4338CA"/>

  <!-- sparkle: the "magic" of one-click capture -->
  <path d="M392 104 q7 26 33 33 q-26 7 -33 33 q-7 -26 -33 -33 q26 -7 33 -33 Z" fill="#FBBF24"/>
  <circle cx="142" cy="338" r="7" fill="#FFFFFF" opacity="0.5"/>

  <!-- cursor -->
  <g transform="translate(296 238) scale(7.5)">
    <path d="M0 0 L0 16 L4.6 12.4 L7.3 18.2 L9.9 17 L7.2 11.3 L12.6 11.3 Z"
          fill="#1C1917" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round" paint-order="stroke"/>
  </g>
</svg>
