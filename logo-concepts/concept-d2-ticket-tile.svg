<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept D2 — "Ticket tile": the app icon IS the ticket. Notch bites at the
       top and bottom of a real perforation line; entry on the left, play stub
       on the right. Silhouette survives every size because it's the canvas. -->
  <defs>
    <linearGradient id="d2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <mask id="d2tile">
      <rect width="512" height="512" rx="116" fill="white"/>
      <circle cx="348" cy="0" r="48" fill="black"/>
      <circle cx="348" cy="512" r="48" fill="black"/>
      <line x1="348" y1="90" x2="348" y2="422" stroke="black" stroke-width="13"
            stroke-linecap="round" stroke-dasharray="0.1 41.5"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#d2bg)" mask="url(#d2tile)"/>

  <!-- entry -->
  <rect x="92" y="208" width="148" height="40" rx="20" fill="#1C1917"/>
  <rect x="92" y="282" width="186" height="22" rx="11" fill="#1C1917"/>

  <!-- stub: play glyph -->
  <path d="M400 214 L400 298 L466 256 Z" fill="#1C1917"/>
</svg>
