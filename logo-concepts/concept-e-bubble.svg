<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept E — "Caption bubble": a speech bubble carrying a subtitle line with
       one chunk highlighted. Language-first; the highlight ties back to the app. -->
  <defs>
    <linearGradient id="ebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#ebg)"/>

  <!-- bubble + tail -->
  <rect x="96" y="108" width="320" height="216" rx="52" fill="#FFFFFF"/>
  <path d="M172 310 L172 392 Q172 412 189 398 L272 320 Z" fill="#FFFFFF"/>

  <!-- line 1: word · [highlighted chunk] -->
  <rect x="144" y="164" width="88" height="36" rx="18" fill="#CBD5E1"/>
  <rect x="248" y="154" width="120" height="56" rx="22" fill="#EAB308"/>
  <rect x="264" y="164" width="88" height="36" rx="18" fill="#FFFFFF"/>

  <!-- line 2 -->
  <rect x="144" y="242" width="140" height="36" rx="18" fill="#CBD5E1"/>
  <rect x="300" y="242" width="68" height="36" rx="18" fill="#94A3B8"/>
</svg>
